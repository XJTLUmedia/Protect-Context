[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "protect-context"
version = "3.3.1"
description = "protect-context agent guardrail suite: shared store, MCP server (fastmcp), CLI"
readme = "README.md"
license = "MIT"
# NOTICE carries the CC BY-SA 4.0 attribution for the dictionary section
# of lexicon.tsv, so it ships with the wheel the same way LICENSE does.
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Alex Yu", email = "xjtlumedia@gmail.com" }]
keywords = [
  "mcp",
  "model-context-protocol",
  "agent-guardrails",
  "coding-agents",
  "cli",
  "evidence",
]
# `license = "MIT"` is the SPDX expression. setuptools>=77 rejects a License
# classifier next to that expression, so the OSI license classifier is omitted.
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
requires-python = ">=3.10"
# Every third-party module the package imports directly is declared here, even
# when a dependency would pull it in transitively: `pip install protect-context`
# into a clean environment used to leave `store.py` importing an undeclared
# `tenacity` and `layers.py` an undeclared `dotenv`, so the whole package failed
# at import (found 2026-11-10 by installing the wheel in a bare container).
# `tests/test_registry.py::test_every_third_party_import_is_declared` keeps this
# list honest in both directions.
dependencies = [
  "cachetools>=5,<8",
  "fastmcp>=3,<4",
  "humanize>=4,<5",
  "mcp>=1.2,<2",
  "orjson>=3,<4",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "pybreaker>=1,<2",
  "python-dotenv>=1,<2",
  "rich>=13,<16",
  "tenacity>=8,<10",
  "typer>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/XJTLUmedia/Protect-Context"
Repository = "https://github.com/XJTLUmedia/Protect-Context"
Issues = "https://github.com/XJTLUmedia/Protect-Context/issues"
Documentation = "https://github.com/XJTLUmedia/Protect-Context#readme"
"MCP Registry" = "https://registry.modelcontextprotocol.io/"

[project.optional-dependencies]
dev = ["pytest", "build>=1,<2"]

[project.scripts]
protect-context = "protect_context.cli:main"
protect-context-typer = "protect_context.typer_cli:app"

[tool.setuptools.packages.find]
where = ["src"]

# The English/中文 term bridge is data, not code: the generated table ships
# inside the package so `pip install` gets the same bytes the repo reads.
[tool.setuptools.package-data]
protect_context = ["lexicon.tsv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
