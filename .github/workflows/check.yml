# Runs what the 12-constraint contract asks a change to pass: the extension
# suite (typecheck + node tests) and the Python suite (pytest). Validation for
# this repo was manual before the 2026-11-10 audit; nothing enforced it.
name: Check

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Least privilege, and no token left behind in .git/config: this workflow only
# reads the checkout (hardening findings on the file as first written).
permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    name: Extension (typecheck + node tests)
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit SHA, with the release in the comment: a movable tag on
      # a third-party action is a supply-chain input to every run.
      # vendor/ is upstream checkouts recorded as gitlinks. Checkout still runs
      # `git submodule foreach` while removing credentials, and that exits 128
      # when a gitlink has no URL in .gitmodules — before this job can start.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      # Four tests in this job are cross-runtime contract tests that shell out to
      # `python3` and `git` (contract concurrency, the store lease, evidence-id
      # allocation, orientation root). ubuntu-latest happens to ship both, so a
      # missing interpreter is an incidental dependency, not a design decision —
      # pin it, or the job fails on an image change for a reason that looks like
      # a code defect (found 2026-11-10 by running this job in a bare node:22
      # container: 4 failures, all `spawn python3 ENOENT` / `spawnSync git`).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      # Three of those cross-runtime tests import `protect_context` from the child
      # interpreter (contract concurrency, store lease, evidence-id allocation), so
      # the package must actually be installed — a bare `python3` is not enough
      # (found 2026-11-10 in a container: `ModuleNotFoundError: dotenv`).
      - run: pip install -e .
      - run: npm ci
      - run: npm run check

  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Every version pyproject classifies. A declared-but-untested version is
        # a claim, not support: 3.11 and 3.13 were green in containers on
        # 2026-11-10 and now run here.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      # Same submodule checkout as the extension job: vendor/ must be present,
      # and foreach needs a URL for every gitlink.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
